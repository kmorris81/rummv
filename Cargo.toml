[package]
name = "rummv"
version = "0.2.0"
edition = "2024"
description = "Fast image & video viewer with folder navigation (Windows Photos-style)"
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "default_fonts", "clipboard", "system_fonts"] }
egui = "0.37"
# Ensure winit gets its default Linux features (Wayland CSD, dlopen, etc.).
winit = "0.30"
glow = "0.17"
raw-window-handle = "0.6"
png = "0.18"
libmpv2 = "7"
image = { version = "0.25", default-features = false, features = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
libheif-rs = "3"
jxl-oxide = { version = "0.12", features = ["image"] }
resvg = "0.49"
psd = "0.3"
rawler = "0.8"
kamadak-exif = "0.6"
natord = "1"
notify = "8"
trash = "5"
serde = { version = "1", features = ["derive"] }
toml = "1"
dirs = "7"
infer = "0.22"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
crossbeam-channel = "0.5"
md5 = "0.8"
url = "2"
jiff = "0.2"

[profile.release]
lto = "thin"
codegen-units = 4

[profile.dev.package."*"]
opt-level = 2
